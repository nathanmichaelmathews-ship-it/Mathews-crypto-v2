name: hub snapshot

# Hourly at :07 UTC — collects every source through the same code the Vercel functions use and commits
# data/latest.json + data/brief.txt (+ data/daily/YYYY-MM-DD.json). Read them with:
#   curl -sS "https://raw.githubusercontent.com/nathanmichaelmathews-ship-it/mathews-crypto-v2/main/data/latest.json?cb=<stamp>"
# (raw.githubusercontent.com is allowlisted from the Claude workspace shell; its CDN caches for up to 5 minutes.)
# Optional repository secrets (Settings → Secrets and variables → Actions): COINGECKO_API_KEY, COINALYZE_API_KEY, SEC_CONTACT.
# GitHub disables cron workflows after 60 days without repository activity — any commit re-enables it.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "full run (onchain + polymarket + dat)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: hub-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: collect
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then node scripts/snapshot.mjs --full; else node scripts/snapshot.mjs; fi
      - name: commit
        run: |
          git config user.name "hub-snapshot"
          git config user.email "hub-snapshot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
